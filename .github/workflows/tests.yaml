name: Petstore API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Petstore API tests
        run: |
          pytest --alluredir=allure-results

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # Устанавливаем Allure через apt (более надёжно)
      - name: Install Allure
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.zip
          sudo unzip allure-2.27.0.zip -d /opt/
          sudo ln -s /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
          allure --version

      - name: Generate Allure Report
        run: |
          # Копируем историю из gh-pages если есть
          if [ -d "gh-pages/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/ || true
            echo "History copied from gh-pages"
          else
            echo "No history found, starting fresh"
          fi
          
          # Генерируем отчёт
          allure generate allure-results -o allure-report --clean
          
          echo "Report generated successfully"

      - name: Prepare for deployment
        run: |
          # Создаём папку для деплоя
          mkdir -p deploy
          
          # Копируем сгенерированный отчёт
          cp -r allure-report/* deploy/ || true
          
          # Сохраняем историю для будущих запусков
          if [ -d "allure-report/history" ]; then
            mkdir -p deploy/history
            cp -r allure-report/history/* deploy/history/ || true
          fi
          
          # Если есть старая история из gh-pages, сохраняем её
          if [ -d "gh-pages/history" ]; then
            mkdir -p deploy/history
            cp -r gh-pages/history/* deploy/history/ || true
          fi
          
          # Копируем .nojekyll если есть
          if [ -f "gh-pages/.nojekyll" ]; then
            cp gh-pages/.nojekyll deploy/ || true
          fi
          
          echo "Deploy folder prepared"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./deploy
          keep_files: true