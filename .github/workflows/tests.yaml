name: Petstore API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Ручной запуск

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Убираем swagger-coverage-tool, если он не используется в Petstore проекте
      # Если используете - раскомментируйте и настройте
      # - name: Install swagger-coverage-tool
      #   run: npm install -g swagger-coverage-tool

      - name: Run Petstore API tests with pytest and generate Allure results
        run: |
          pytest --alluredir=allure-results

      # Загружаем Allure результаты как артефакт для следующего job'а
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()  # Всегда публикуем отчёт, даже если тесты упали
    needs: [ run-tests ]  # Ждём завершения run-tests
    runs-on: ubuntu-latest

    steps:
      # Клонируем ветку gh-pages для сохранения истории отчётов
      - name: Check out gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      # Скачиваем Allure результаты из предыдущего job'а
      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      # Генерируем Allure отчёт с историей
      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      # Деплоим отчёт на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history