name: Petstore API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Petstore API tests
        run: |
          pytest --alluredir=allure-results

      - name: Check if tests created files
        run: |
          echo "=== Содержимое allure-results ==="
          ls -la allure-results/ || echo "Папка allure-results пуста или не существует!"
          echo "=== Количество JSON файлов ==="
          find allure-results/ -name "*.json" 2>/dev/null | wc -l
          echo "=== Первые 5 файлов ==="
          ls -la allure-results/ | head -6 || echo "Нет файлов"

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results

  publish-report:
    if: always()
    needs: [ run-tests ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results
          path: allure-results

      - name: Check what was downloaded
        run: |
          echo "=== Текущая директория ==="
          pwd
          echo "=== Что скачалось в allure-results ==="
          ls -la allure-results/ || echo "Папка allure-results пуста или не существует!"
          echo "=== Сколько JSON файлов ==="
          find allure-results/ -name "*.json" 2>/dev/null | wc -l
          echo "=== Содержимое gh-pages ==="
          ls -la gh-pages/ || echo "Папка gh-pages пуста или не существует!"

      - name: Create last-history directory if not exists
        run: |
          mkdir -p gh-pages/last-history
          mkdir -p allure-history
          echo "Папки созданы"

      - name: Check structure before Allure generation
        run: |
          echo "=== Проверка структуры перед генерацией Allure ==="
          echo "allure-results существует: $(test -d allure-results && echo ДА || echo НЕТ)"
          echo "gh-pages/last-history существует: $(test -d gh-pages/last-history && echo ДА || echo НЕТ)"
          echo "allure-history существует: $(test -d allure-history && echo ДА || echo НЕТ)"
          echo "=== Файлы в allure-results (первые 10) ==="
          ls -la allure-results/ | head -10 || echo "Нет файлов"

      - name: Generate Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history

      - name: Check generated report
        run: |
          echo "=== Содержимое allure-report ==="
          ls -la allure-report/ || echo "Папка allure-report не создалась!"
          echo "=== Содержимое allure-history ==="
          ls -la allure-history/ || echo "Папка allure-history не создалась!"
          echo "=== Содержимое allure-history/last-history ==="
          ls -la allure-history/last-history/ 2>/dev/null || echo "Папка last-history не создалась!"

      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history